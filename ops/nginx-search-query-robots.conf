# Include at ajew.org HTTPS server scope, alongside other add_header rules.
# Keep working search pages HTTP 200 and the base landing page indexable.
# $uri also reaches /search-enhanced/index.html after nginx's index redirect.
# Pure set-only rewrite conditions; never reflect a query in a response header.
set $ajew_search_query_value "";
set $ajew_search_query_robots "";
if ($uri ~ "^/search-enhanced(/index\.html|/)?$") {
    set $ajew_search_query_value $arg_q;
}
if ($ajew_search_query_value != "") {
    set $ajew_search_query_robots "noindex, follow";
}
add_header X-Robots-Tag $ajew_search_query_robots always;
