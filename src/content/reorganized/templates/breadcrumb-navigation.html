<!-- Breadcrumb Navigation Template -->
<nav class="breadcrumb-nav" aria-label="Breadcrumb">
  <ol class="breadcrumb-list">
    {{#each breadcrumbs}}
    <li class="breadcrumb-item {{#if @last}}active{{/if}}">
      {{#if url}}
      <a href="{{url}}" class="breadcrumb-link">
        {{#if icon}}
        <span class="breadcrumb-icon">{{icon}}</span>
        {{/if}}
        <span class="breadcrumb-text">{{text}}</span>
        {{#if hebrewText}}
        <span class="breadcrumb-hebrew">{{hebrewText}}</span>
        {{/if}}
      </a>
      {{else}}
      <span class="breadcrumb-current">
        {{#if icon}}
        <span class="breadcrumb-icon">{{icon}}</span>
        {{/if}}
        <span class="breadcrumb-text">{{text}}</span>
        {{#if hebrewText}}
        <span class="breadcrumb-hebrew">{{hebrewText}}</span>
        {{/if}}
      </span>
      {{/if}}
      
      {{#unless @last}}
      <span class="breadcrumb-separator">/</span>
      {{/unless}}
    </li>
    {{/each}}
  </ol>
</nav>

<style>
.breadcrumb-nav {
  margin: 1.5rem 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

.breadcrumb-list {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  list-style: none;
  padding: 0;
  margin: 0;
  gap: 0.25rem;
}

.breadcrumb-item {
  display: flex;
  align-items: center;
  color: #6b7280;
}

.breadcrumb-item.active {
  color: #111827;
  font-weight: 600;
}

.breadcrumb-link {
  display: flex;
  align-items: center;
  text-decoration: none;
  color: inherit;
  padding: 0.375rem 0.5rem;
  border-radius: 0.375rem;
  transition: all 0.2s ease;
  gap: 0.375rem;
}

.breadcrumb-link:hover {
  background: #f3f4f6;
  color: #3b82f6;
}

.breadcrumb-current {
  display: flex;
  align-items: center;
  padding: 0.375rem 0.5rem;
  gap: 0.375rem;
}

.breadcrumb-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  font-size: 0.875rem;
}

.breadcrumb-text {
  font-size: 0.875rem;
  line-height: 1.25rem;
}

.breadcrumb-hebrew {
  font-size: 0.875rem;
  font-family: 'Frank Ruhl Libre', 'David', 'Times New Roman', serif;
  direction: rtl;
  margin-right: 0.25rem;
}

.breadcrumb-separator {
  margin: 0 0.25rem;
  color: #d1d5db;
  user-select: none;
}

/* Compact version */
.breadcrumb-nav.compact .breadcrumb-text {
  font-size: 0.75rem;
}

.breadcrumb-nav.compact .breadcrumb-hebrew {
  font-size: 0.75rem;
}

.breadcrumb-nav.compact .breadcrumb-link,
.breadcrumb-nav.compact .breadcrumb-current {
  padding: 0.25rem 0.375rem;
}

/* Dark mode support */
@media (prefers-color-scheme: dark) {
  .breadcrumb-item {
    color: #9ca3af;
  }
  
  .breadcrumb-item.active {
    color: #f9fafb;
  }
  
  .breadcrumb-link:hover {
    background: #374151;
    color: #60a5fa;
  }
  
  .breadcrumb-separator {
    color: #4b5563;
  }
}

/* Responsive */
@media (max-width: 640px) {
  .breadcrumb-nav:not(.compact) .breadcrumb-hebrew {
    display: none;
  }
  
  .breadcrumb-nav:not(.compact) .breadcrumb-text {
    max-width: 100px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
}

/* Animation for breadcrumb updates */
@keyframes breadcrumbHighlight {
  0% { background-color: transparent; }
  50% { background-color: rgba(59, 130, 246, 0.1); }
  100% { background-color: transparent; }
}

.breadcrumb-item.highlight {
  animation: breadcrumbHighlight 1s ease;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const breadcrumbLinks = document.querySelectorAll('.breadcrumb-link');
  
  // Add click handlers with loading state
  breadcrumbLinks.forEach(link => {
    link.addEventListener('click', function(e) {
      // Don't intercept if modifier key is pressed
      if (e.ctrlKey || e.metaKey || e.shiftKey) return;
      
      // Don't intercept if it's an external link
      if (this.target === '_blank' || this.href.startsWith('http')) return;
      
      e.preventDefault();
      
      // Add loading state to the clicked breadcrumb
      this.classList.add('loading');
      const originalHTML = this.innerHTML;
      this.innerHTML = `
        <span class="breadcrumb-icon">⏳</span>
        <span class="breadcrumb-text">Loading...</span>
      `;
      this.style.pointerEvents = 'none';
      
      // Navigate after a brief delay to show loading state
      setTimeout(() => {
        window.location.href = this.href;
      }, 300);
    });
  });
  
  // Highlight the current breadcrumb based on scroll position
  function highlightCurrentBreadcrumb() {
    const breadcrumbItems = document.querySelectorAll('.breadcrumb-item');
    const scrollPosition = window.scrollY;
    const windowHeight = window.innerHeight;
    const documentHeight = document.documentElement.scrollHeight;
    
    // Simple logic: highlight based on scroll percentage
    const scrollPercent = scrollPosition / (documentHeight - windowHeight);
    
    if (scrollPercent > 0.8) {
      // Near bottom - highlight last breadcrumb
      breadcrumbItems.forEach(item => item.classList.remove('highlight'));
      if (breadcrumbItems.length > 0) {
        breadcrumbItems[breadcrumbItems.length - 1].classList.add('highlight');
      }
    } else if (scrollPercent < 0.2) {
      // Near top - highlight first breadcrumb
      breadcrumbItems.forEach(item => item.classList.remove('highlight'));
      if (breadcrumbItems.length > 0) {
        breadcrumbItems[0].classList.add('highlight');
      }
    }
  }
  
  // Only run highlight if we're on a long page
  if (document.documentElement.scrollHeight > window.innerHeight * 2) {
    window.addEventListener('scroll', highlightCurrentBreadcrumb);
    highlightCurrentBreadcrumb(); // Initial call
  }
  
  // Keyboard navigation for breadcrumbs
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    
    if (e.key === 'b' && e.ctrlKey) {
      e.preventDefault();
      const breadcrumbLinks = document.querySelectorAll('.breadcrumb-link');
      if (breadcrumbLinks.length > 0) {
        // Focus the last breadcrumb link (usually the most relevant)
        breadcrumbLinks[breadcrumbLinks.length - 1].focus();
      }
    }
  });
});
</script>
