# Include inside the ajew.org HTTPS server, before the legacy /blog alias.
location = /blog { return 302 /blog/; }
location = /blog/index.html { return 302 /blog/; }
location = /blog/admin { return 302 /blog/write/; }
location = /blog/admin/ { return 302 /blog/write/; }
location = /blog/write { return 302 /blog/write/; }
location ^~ /blog/write/ {
    client_max_body_size 1250k;
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
}
location ^~ /blog/p/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location = /blog/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 502 503 504 = /__ajew_legacy_blog_index;
}
location = /blog/rss.xml {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:8790;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 502 503 504 = /__ajew_legacy_blog_rss;
}
location = /__ajew_legacy_blog_index {
    internal;
    alias /opt/ajew-blog/index.html;
    add_header Cache-Control "no-store";
}
location = /__ajew_legacy_blog_rss {
    internal;
    alias /opt/ajew-blog/rss.xml;
    add_header Cache-Control "no-store";
}
