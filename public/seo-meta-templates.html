<!-- SEO Meta Tags Template for Teachers Pages -->
<!-- Add this to each teacher/book page -->

<!-- Primary Meta Tags -->
<title>{{TITLE}} - A Jew - Na Nach Breslov Torah Teachings</title>
<meta name="description" content="{{DESCRIPTION}} - Learn more about Rebbe Nachman's teachings at ajew.org">
<meta name="keywords" content="Rebbe Nachman, Breslov, Torah, teachings, Na Nach, Likutay Moharan, Sipurey Maasiyos">
<meta name="author" content="A Jew - Na Nach Breslov Community">

<!-- Open Graph / Facebook -->
<meta property="og:type" content="article">
<meta property="og:url" content="{{CANONICAL_URL}}">
<meta property="og:title" content="{{TITLE}} - A Jew">
<meta property="og:description" content="{{DESCRIPTION}}">
<meta property="og:image" content="{{OG_IMAGE_URL}}">
<meta property="og:site_name" content="A Jew - Na Nach">
<meta property="article:publisher" content="https://www.facebook.com/ajeworg">

<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:url" content="{{CANONICAL_URL}}">
<meta name="twitter:title" content="{{TITLE}} - A Jew">
<meta name="twitter:description" content="{{DESCRIPTION}}">
<meta name="twitter:image" content="{{OG_IMAGE_URL}}">
<meta name="twitter:site" content="@ajeworg">
<meta name="twitter:creator" content="@ajeworg">

<!-- Structured Data (JSON-LD) for Article -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{TITLE}}",
  "description": "{{DESCRIPTION}}",
  "url": "{{CANONICAL_URL}}",
  "image": {
    "@type": "ImageObject",
    "url": "{{OG_IMAGE_URL}}",
    "width": 1200,
    "height": 630
  },
  "author": {
    "@type": "Organization",
    "name": "A Jew - Na Nach Breslov",
    "url": "https://ajew.org"
  },
  "publisher": {
    "@type": "Organization",
    "name": "A Jew - Na Nach Breslov",
    "url": "https://ajew.org",
    "logo": {
      "@type": "ImageObject",
      "url": "https://ajew.org/og-image.svg",
      "width": 512,
      "height": 512
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{CANONICAL_URL}}"
  }
}
</script>
