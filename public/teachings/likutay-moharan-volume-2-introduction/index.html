<!DOCTYPE html>
<html>
<head>
    <title>Volume 2 Introduction - Likutay Moharan Volume 2</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .hebrew { font-family: 'David', 'Times New Roman', serif; direction: rtl; text-align: right; }
        .english { margin-top: 20px; }
        .language-toggle { margin-bottom: 20px; }
        button { margin: 0 5px; padding: 5px 10px; }
    </style>
</head>
<body>
    <h1>Volume 2 Introduction</h1>
    <h2>Likutay Moharan Volume 2</h2>
    
    <div class="language-toggle">
        <button onclick="showHebrew()">Hebrew</button>
        <button onclick="showEnglish()">English</button>
        <button onclick="showBoth()">Both</button>
    </div>
    
    <div id="hebrew-content" class="hebrew" style="display: none;">
        <h2>Hebrew Content</h2>
        <p>Hebrew content will be added here.</p>
    </div>
    
    <div id="english-content" class="english" style="display: none;">
        <h2>English Translation</h2>
        <p>English translation will be added here.</p>
    </div>
    
    <script>
        function showHebrew() {
            document.getElementById('hebrew-content').style.display = 'block';
            document.getElementById('english-content').style.display = 'none';
        }
        function showEnglish() {
            document.getElementById('hebrew-content').style.display = 'none';
            document.getElementById('english-content').style.display = 'block';
        }
        function showBoth() {
            document.getElementById('hebrew-content').style.display = 'block';
            document.getElementById('english-content').style.display = 'block';
        }
        
        // Default to showing both
        showBoth();
    </script>
</body>
</html>
