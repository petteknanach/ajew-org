# Directory-shaped Reader URLs must resolve a real index, not a bare folder.
# In particular, removing an empty generated error wrapper must produce 404,
# not nginx's default directory-without-index 403. Exact locations and raw
# export aliases retain priority; files, nonnumeric routes and other site
# paths keep their existing handling.
location ~ ^/reader/[^/]+/[0-9]+/[^/]+/$ {
    try_files ${uri}index.html =404;
}
